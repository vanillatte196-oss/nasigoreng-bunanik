<!-- Floating Cart Button (Tombol Keranjang) -->
<div class="floating-cart" onclick="openCartModal()">
  🛒 Keranjang (<span id="cart-count">0</span>)
</div>

<!-- Modal Formulir Pemesanan -->
<div id="cartModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeCartModal()">&times;</span>
    <h2>🛒 Rincian Pemesanan</h2>
    
    <!-- Ringkasan Item -->
    <div id="cart-items-list">
      <p class="empty-msg">Keranjang belanja masih kosong.</p>
    </div>

    <div class="total-box">
      <strong>Total: </strong><span id="cart-total-price">Rp 0</span>
    </div>

    <hr>

    <!-- Form Data Pembeli -->
    <h3>Formulir Pengiriman</h3>
    <form id="orderForm" onsubmit="sendOrderToWA(event)">
      <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" id="cust-name" required placeholder="Contoh: Budi">
      </div>

      <div class="form-group">
        <label>Alamat Lengkap Pengiriman (Ungaran Barat) *</label>
        <textarea id="cust-address" rows="2" required placeholder="Jl. Pemuda No. 12, RT 02/RW 03..."></textarea>
      </div>

      <div class="form-group">
        <label>Metode Pembayaran *</label>
        <select id="payment-method" required onchange="togglePaymentInfo()">
          <option value="QRIS">QRIS (BCA, Mandiri, GoPay, OVO, ShopeePay)</option>
          <option value="Transfer Bank BCA">Transfer Bank BCA</option>
          <option value="COD / Cash">Bayar di Tempat (COD)</option>
        </select>
      </div>

      <!-- Info Rekening/QRIS (Tampil Sesuai Pilihan) -->
      <div id="payment-info-box" class="payment-info">
        <p><strong>Info Pembayaran:</strong></p>
        <p id="payment-detail">Scan QRIS saat WhatsApp terhubung / transfer ke BCA 123456789 a.n Bu Nanik.</p>
      </div>

      <div class="form-group">
        <label>Catatan Tambahan (Opsional)</label>
        <input type="text" id="cust-notes" placeholder="Misal: Jangan terlalu pedas">
      </div>

      <button type="submit" class="btn-submit-order">📱 Kirim Pesanan via WhatsApp</button>
    </form>

  </div>
</div>
